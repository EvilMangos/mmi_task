[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testkit"
version = "0.1.0"
description = "Fixtures, fakes (fake order books, fake clock, etc.)"
requires-python = ">=3.11"
dependencies = [
    "domain-orderbook",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/testkit"]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]
asyncio_mode = "auto"
