[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notifier-telegram"
version = "0.1.0"
description = "Telegram bot client + message formatting"
requires-python = ">=3.11"
dependencies = [
    "contracts",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aioresponses>=0.7.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/notifier_telegram"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["src/notifier_telegram"]
python_files = "*_test.py"
python_classes = "Test*"
python_functions = "test_*"
