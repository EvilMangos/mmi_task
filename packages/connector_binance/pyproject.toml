[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "connector-binance"
version = "0.1.0"
description = "Binance WS/REST client, emits normalized order book events"
requires-python = ">=3.11"
dependencies = [
    "domain-orderbook",
    "config",
    "observability",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/connector_binance"]
