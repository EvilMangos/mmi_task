[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orderbook-watcher"
version = "0.1.0"
description = "Deployable service - the main runtime"
requires-python = ">=3.11"
dependencies = [
    "config",
    "domain-orderbook",
    "domain-imbalance",
    "signal-engine",
    "connector-binance",
    "notifier-telegram",
    "observability",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "testkit",
]

[project.scripts]
orderbook-watcher = "orderbook_watcher.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orderbook_watcher"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/orderbook_watcher"]
python_files = ["*_test.py"]
