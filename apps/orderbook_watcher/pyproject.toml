[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orderbook-watcher"
version = "0.1.0"
description = "Deployable service - the main runtime"
requires-python = ">=3.11"
dependencies = [
    "config",
    "domain-orderbook",
    "domain-imbalance",
    "signal-engine",
    "connector-binance",
    "notifier-telegram",
    "observability",
]

[project.scripts]
orderbook-watcher = "orderbook_watcher.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orderbook_watcher"]
